name: Publish Education Garden
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Filter Public Content
        run: |
          # Удаляем приватные заметки
          find . -name "*.md" -path "*/🔒 Private/*" -delete
          
          # Удаляем заметки с public: false
          find . -name "*.md" -exec grep -l "public: false" {} \; | xargs rm
          
          # Удаляем черновики
          find . -name "*.md" -exec grep -l "status: draft" {} \; | xargs rm

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
