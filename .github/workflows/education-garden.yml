name: Deploy Education Garden to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Quartz
        run: |
          # Клонируем Quartz
          git clone https://github.com/jackyzha0/quartz.git _quartz
          cd _quartz
          npm ci
          
      - name: Prepare content
        run: |
          # Создаем папку для контента
          mkdir -p _quartz/content
          
          # Копируем ВСЕ материалы сначала
          cp -r "./📚 Учебные курсы" "_quartz/content/" || echo "No courses folder"
          cp -r "./🌐 Публикация" "_quartz/content/" || echo "No publication folder"
          
          # Удаляем только то, что точно приватное
          if [ -d "_quartz/content/🔒 Private" ]; then
            rm -rf "_quartz/content/🔒 Private"
          fi
          
      - name: Build site
        run: |
          cd _quartz
          npx quartz build
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _quartz/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
