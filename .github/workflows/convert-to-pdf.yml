name: Simple MD to PDF Converter

on:
  push:
    branches: [main, master]
    paths: ['**.md']

jobs:
  convert-pdf:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive-xetex texlive-lang-cyrillic
    
    - name: Create PDF folder
      run: mkdir -p _pdf_export
    
    - name: Convert all MD files to PDF
      run: |
        find . -name "*.md" -type f ! -path "./.git/*" ! -path "./_pdf_export/*" | while read file; do
          pdf_path="_pdf_export/$(dirname "${file#./}")/$(basename "$file" .md).pdf"
          mkdir -p "$(dirname "$pdf_path")"
          echo "Converting: $file -> $pdf_path"
          pandoc "$file" -o "$pdf_path" --pdf-engine=xelatex -V mainfont="DejaVu Serif" -V lang=russian || echo "Failed: $file"
        done
    
    - name: Push PDF files
      run: |
        git config --local user.email "github-actions@example.com"
        git config --local user.name "GitHub Actions"
        git add _pdf_export/
        git diff --cached --quiet || git commit -m "Add PDF versions"
        git push
