name: PDF Fallback Conversion

on:
  workflow_run:
    workflows: ["Convert Markdown to PDF with Russian Support"]
    types:
      - completed

jobs:
  handle-failures:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc texlive-xetex texlive-lang-cyrillic
    
    - name: Run advanced converter
      run: |
        python3 .github/scripts/advanced-pdf-converter.py
